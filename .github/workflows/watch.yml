name: Noon Minutes Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # كل 15 دقيقة (بتوقيت UTC)
  workflow_dispatch: {}      # زر تشغيل يدوي من تبويب Actions

permissions:
  contents: write   # يحتاجها عشان يحفظ seen.json داخل الريبو

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one scan cycle
        env:
          SINGLE_CYCLE: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_VISITOR_ID: ${{ secrets.X_VISITOR_ID }}
          X_LAT: ${{ secrets.X_LAT }}
          X_LNG: ${{ secrets.X_LNG }}
          X_ECOM_ZONECODE: ${{ secrets.X_ECOM_ZONECODE }}
          X_NOONINSTANT_ZONECODE: ${{ secrets.X_NOONINSTANT_ZONECODE }}
          X_SERVICES_ZONECODE: ${{ secrets.X_SERVICES_ZONECODE }}
          X_BUILD: ${{ secrets.X_BUILD }}
          NOON_COOKIES: ${{ secrets.NOON_COOKIES }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          PRIORITY_1_THRESHOLD: ${{ secrets.PRIORITY_1_THRESHOLD }}
          PRIORITY_2_THRESHOLD: ${{ secrets.PRIORITY_2_THRESHOLD }}
        run: python watcher.py

      - name: Save state (seen.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen.json"
          file_pattern: seen.json
